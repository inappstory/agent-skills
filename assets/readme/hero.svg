<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ias-agent-skills - InAppStory SDK Agent Skills</title>
  <desc id="hero-desc">Installable AI agent skills for integrating the InAppStory SDK across Android, iOS, Flutter, React Native, React, and Vanilla JS.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>

    <!-- Brand Header Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#00DFD8"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="card-hover-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="glow-magenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00DFD8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00DFD8" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.35"/>
    </pattern>

    <!-- InAppStory Star Logo Gradients (from official Logo_Star.svg) -->
    <linearGradient id="star-g0" x1="0" y1="0" x2="22.08" y2="20.85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF007A"/>
      <stop offset="1" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="star-g1" x1="28.42" y1="36.43" x2="50.5" y2="57.28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7928CA"/>
      <stop offset="1" stop-color="#00DFD8"/>
    </linearGradient>
    <linearGradient id="star-g2" x1="0" y1="34.43" x2="22.08" y2="57.28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF007A"/>
      <stop offset="1" stop-color="#00DFD8"/>
    </linearGradient>
    <linearGradient id="star-g3" x1="28.42" y1="0" x2="50.5" y2="22.85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF007A"/>
      <stop offset="1" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="star-g4" x1="17.35" y1="12.29" x2="33.15" y2="28.64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF007A"/>
      <stop offset="1" stop-color="#7928CA"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #FFFFFF; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 18px; fill: #94A3B8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #FF007A; letter-spacing: 1.5px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 15px; fill: #F8FAFC; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #94A3B8; }
    .platform-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #F1F5F9; }
    .platform-tech { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #64748B; }
    .section-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #38BDF8; letter-spacing: 1.5px; }
  </style>

  <!-- Container Box -->
  <rect width="1200" height="440" rx="18" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2"/>
  <rect width="1200" height="440" rx="18" fill="url(#dot-grid)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#brand-grad)"/>

  <!-- Ambient Glow Effects -->
  <circle cx="150" cy="180" r="220" fill="url(#glow-magenta)"/>
  <circle cx="950" cy="220" r="240" fill="url(#glow-cyan)"/>

  <!-- Left Column: Branding, Title & 3 Core Pillar Cards -->
  <g transform="translate(55, 45)">
    <!-- Header Row: Star Emblem + Pill Badge -->
    <g transform="translate(0, 0)">
      <!-- Star Icon (Scaled & Positioned) -->
      <g transform="translate(0, 0) scale(0.65)">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12.9818 20.8504C7.79442 22.8465 0 20.2195 0 20.2195C0 20.2195 5.58622 16.5925 7.58157 11.4031C9.57692 6.21374 7.6477 0 7.6477 0C7.6477 0 12.5028 4.31682 14.4982 9.50622C16.4935 14.6956 22.0797 18.3226 22.0797 18.3226C22.0797 18.3226 18.1692 18.8543 12.9818 20.8504Z" fill="url(#star-g0)"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M37.5218 36.4251C42.7092 34.429 50.5036 37.056 50.5036 37.056C50.5036 37.056 44.9174 40.683 42.922 45.8724C40.9267 51.0618 42.8559 57.2755 42.8559 57.2755C42.8559 57.2755 38.0008 52.9587 36.0054 47.7693C34.0101 42.5799 28.4239 38.9529 28.4239 38.9529C28.4239 38.9529 32.3344 38.4212 37.5218 36.4251Z" fill="url(#star-g1)"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12.9818 36.4251C18.1692 38.4212 22.0797 38.9529 22.0797 38.9529C22.0797 38.9529 16.4935 42.5799 14.4982 47.7693C12.5028 52.9587 7.6477 57.2755 7.6477 57.2755C7.6477 57.2755 9.57692 51.0618 7.58157 45.8724C5.58622 40.683 0 37.056 0 37.056C0 37.056 7.79442 34.429 12.9818 36.4251Z" fill="url(#star-g2)"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M37.5218 20.8504C32.3344 18.8543 28.4239 18.3226 28.4239 18.3226C28.4239 18.3226 34.0101 14.6956 36.0054 9.50622C38.0008 4.31682 42.8559 0 42.8559 0C42.8559 0 40.9267 6.21374 42.922 11.4031C44.9174 16.5925 50.5036 20.2195 50.5036 20.2195C50.5036 20.2195 42.7092 22.8465 37.5218 20.8504Z" fill="url(#star-g3)"/>
        <path fill-rule="evenodd" clip-rule="evenodd" d="M25.2518 28.6378C29.6108 28.6378 33.1499 24.9786 33.1499 20.4646C33.1499 15.9506 29.6108 12.2913 25.2518 12.2913C20.8928 12.2913 17.3538 15.9506 17.3538 20.4646C17.3538 24.9786 20.8928 28.6378 25.2518 28.6378Z" fill="url(#star-g4)"/>
      </g>

      <!-- Pill Badge -->
      <g transform="translate(44, 4)">
        <rect width="285" height="28" rx="14" fill="#FF007A" fill-opacity="0.12" stroke="#FF007A" stroke-opacity="0.35" stroke-width="1"/>
        <text x="14" y="18" class="badge-text">INAPPSTORY SDK • AGENT SKILLS</text>
      </g>
    </g>

    <!-- Title & Subtitle -->
    <text x="0" y="85" class="title">ias-agent-skills</text>
    <text x="0" y="114" class="subtitle">Installable AI agent skills for InAppStory SDK</text>
    <text x="0" y="135" class="subtitle">integration across 6 platforms</text>

    <!-- 3 Pillar Feature Cards -->
    <g transform="translate(0, 162)">
      <!-- Feature 1: Live Router -->
      <g transform="translate(0, 0)">
        <rect width="168" height="165" rx="12" fill="url(#card-grad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
        <circle cx="36" cy="38" r="18" fill="#38BDF8" fill-opacity="0.15"/>
        <path d="M28 38H44M39 32L45 38L39 44" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="16" y="86" class="card-title">Live Router</text>
        <text x="16" y="108" class="card-sub">Indexes live docs from</text>
        <text x="16" y="125" class="card-sub">docs.inappstory.com</text>
        <text x="16" y="145" class="card-sub" fill="#38BDF8" font-weight="700">✓ Never stale</text>
      </g>

      <!-- Feature 2: Judgment Layer -->
      <g transform="translate(182, 0)">
        <rect width="168" height="165" rx="12" fill="url(#card-grad)" stroke="#A855F7" stroke-opacity="0.3" stroke-width="1"/>
        <circle cx="36" cy="38" r="18" fill="#A855F7" fill-opacity="0.15"/>
        <path d="M28 30H44V46H28V30Z" stroke="#A855F7" stroke-width="2" stroke-linejoin="round"/>
        <path d="M33 36H39M33 40H37" stroke="#A855F7" stroke-width="1.5" stroke-linecap="round"/>
        <text x="16" y="86" class="card-title">Judgment Layer</text>
        <text x="16" y="108" class="card-sub">Playbooks, pitfalls &amp;</text>
        <text x="16" y="125" class="card-sub">architectural guides</text>
        <text x="16" y="145" class="card-sub" fill="#A855F7" font-weight="700">⚡ Version-gated</text>
      </g>

      <!-- Feature 3: Drift Detection -->
      <g transform="translate(364, 0)">
        <rect width="168" height="165" rx="12" fill="url(#card-grad)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
        <circle cx="36" cy="38" r="18" fill="#10B981" fill-opacity="0.15"/>
        <path d="M36 28V38L42 43" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
        <circle cx="36" cy="38" r="10" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3"/>
        <text x="16" y="86" class="card-title">Drift Detection</text>
        <text x="16" y="108" class="card-sub">Automated CLI tool</text>
        <text x="16" y="125" class="card-sub">`scripts/sync-docs`</text>
        <text x="16" y="145" class="card-sub" fill="#10B981" font-weight="700">🔄 Auto-synced</text>
      </g>
    </g>
  </g>

  <!-- Right Column: 6 Platforms Skill Showcase Matrix -->
  <g transform="translate(625, 45)">
    <!-- Background Frame -->
    <rect width="520" height="350" rx="14" fill="#0F172A" fill-opacity="0.75" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Showcase Header -->
    <g transform="translate(24, 24)">
      <text x="0" y="12" class="section-header">SUPPORTED PLATFORMS (6 SKILLS)</text>
      <text x="0" y="32" class="card-sub">Ready to install via npx, Claude Code plugin, or Antigravity</text>
    </g>

    <!-- 6 Platform Grid (2 Columns x 3 Rows) -->
    <g transform="translate(24, 75)">
      <!-- Android -->
      <g transform="translate(0, 0)">
        <rect width="226" height="74" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <circle cx="34" cy="37" r="18" fill="#3DDC84" fill-opacity="0.15"/>
        <g>
          <path d="M26 36 C26 30.5 29.6 26 34 26 C38.4 26 42 30.5 42 36 Z" fill="#3DDC84"/>
          <circle cx="29.5" cy="31.5" r="1.2" fill="#0F172A"/>
          <circle cx="38.5" cy="31.5" r="1.2" fill="#0F172A"/>
          <line x1="28.5" y1="26" x2="26.5" y2="22.5" stroke="#3DDC84" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="39.5" y1="26" x2="41.5" y2="22.5" stroke="#3DDC84" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="25" y1="38" x2="43" y2="38" stroke="#3DDC84" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <text x="62" y="32" class="platform-name">inappstory-android</text>
        <text x="62" y="50" class="platform-tech">Kotlin / Compose • Native</text>
      </g>

      <!-- iOS -->
      <g transform="translate(246, 0)">
        <rect width="226" height="74" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <circle cx="34" cy="37" r="18" fill="#38BDF8" fill-opacity="0.15"/>
        <path d="M37.3 28.1c.8-1 1.4-2.4 1.2-3.8-1.2.1-2.7.8-3.5 1.8-.8.9-1.4 2.3-1.2 3.7 1.4.1 2.8-.7 3.5-1.7zm1.2 1.9c-1.9-.1-3.5 1.1-4.4 1.1-.9 0-2.2-1-3.7-1-1.9 0-3.7 1.1-4.7 2.8-2 3.5-.5 8.7 1.4 11.5 1 1.4 2.1 2.9 3.6 2.8 1.5-.1 2.1-1 3.8-1s2.3.9 3.8.9c1.5 0 2.5-1.4 3.5-2.8 1.1-1.6 1.6-3.2 1.6-3.3-.1-.1-3.1-1.2-3.1-4.7 0-3 2.4-4.4 2.5-4.5-1.4-2.1-3.6-2.3-4.3-2.3z" fill="#38BDF8"/>
        <text x="62" y="32" class="platform-name">inappstory-ios</text>
        <text x="62" y="50" class="platform-tech">SwiftUI &amp; UIKit • Native</text>
      </g>

      <!-- Flutter -->
      <g transform="translate(0, 88)">
        <rect width="226" height="74" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <circle cx="34" cy="37" r="18" fill="#02569B" fill-opacity="0.25"/>
        <g>
          <path d="M39 26.5 L26.5 39 L30 42.5 L46.5 26.5 Z" fill="#54C5F8"/>
          <path d="M34 35 L29.5 39.5 L34 44 L38.5 39.5 Z" fill="#01579B"/>
          <path d="M34 44 L38.5 48.5 L46 48.5 L38.5 39.5 Z" fill="#29B6F6"/>
        </g>
        <text x="62" y="32" class="platform-name">inappstory-flutter</text>
        <text x="62" y="50" class="platform-tech">Dart • Cross-Platform</text>
      </g>

      <!-- React Native -->
      <g transform="translate(246, 88)">
        <rect width="226" height="74" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <circle cx="34" cy="37" r="18" fill="#61DAFB" fill-opacity="0.15"/>
        <g>
          <g stroke="#61DAFB" stroke-width="1.6" fill="none">
            <ellipse cx="34" cy="37" rx="13" ry="5"/>
            <ellipse cx="34" cy="37" rx="13" ry="5" transform="rotate(60 34 37)"/>
            <ellipse cx="34" cy="37" rx="13" ry="5" transform="rotate(120 34 37)"/>
          </g>
          <circle cx="34" cy="37" r="2.2" fill="#61DAFB"/>
        </g>
        <text x="62" y="32" class="platform-name">inappstory-react-native</text>
        <text x="62" y="50" class="platform-tech">React Native • Mobile</text>
      </g>

      <!-- React -->
      <g transform="translate(0, 176)">
        <rect width="226" height="74" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <circle cx="34" cy="37" r="18" fill="#00DFD8" fill-opacity="0.15"/>
        <g>
          <g stroke="#00DFD8" stroke-width="1.6" fill="none">
            <ellipse cx="34" cy="37" rx="13" ry="5"/>
            <ellipse cx="34" cy="37" rx="13" ry="5" transform="rotate(60 34 37)"/>
            <ellipse cx="34" cy="37" rx="13" ry="5" transform="rotate(120 34 37)"/>
          </g>
          <circle cx="34" cy="37" r="2.2" fill="#00DFD8"/>
        </g>
        <text x="62" y="32" class="platform-name">inappstory-react</text>
        <text x="62" y="50" class="platform-tech">React Web • SDK</text>
      </g>

      <!-- Vanilla JS -->
      <g transform="translate(246, 176)">
        <rect width="226" height="74" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
        <circle cx="34" cy="37" r="18" fill="#F7DF1E" fill-opacity="0.15"/>
        <g>
          <rect x="24" y="27" width="20" height="20" rx="3.5" fill="#F7DF1E"/>
          <text x="41" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#000000" text-anchor="end">JS</text>
