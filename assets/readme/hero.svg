<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="auto" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ias-agent-skills - InAppStory SDK Agent Skills</title>
  <desc id="hero-desc">Installable AI agent skills for integrating the InAppStory SDK across Android, iOS, Flutter, React Native, React, and Vanilla JS.</desc>

  <defs>
    <!-- Background Midnight Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#040710"/>
    </linearGradient>

    <!-- Brand Gradient derived from logo (Cyan -> Electric Blue -> Soft Violet) -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="45%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Outer Ring Gradient from logo -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#D8B4FE"/>
    </linearGradient>

    <!-- Core Blue Disk Gradient -->
    <linearGradient id="core-blue-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A6DFF"/>
      <stop offset="100%" stop-color="#0052E0"/>
    </linearGradient>

    <!-- Terminal Window Gradient -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1224"/>
      <stop offset="100%" stop-color="#060B16"/>
    </linearGradient>

    <!-- Code Block Box Gradient -->
    <linearGradient id="code-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="glow-left" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="grid-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3B82F6" opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Monaco, Consolas, monospace; }

    .hero-title { font-size: 44px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .hero-sub { font-size: 17px; font-weight: 400; fill: #94A3B8; }
    .badge-label { font-size: 11px; font-weight: 700; fill: #38B6FF; letter-spacing: 1.5px; }

    .cmd-prompt { font-size: 13px; font-weight: 600; fill: #38B6FF; }
    .cmd-text { font-size: 13px; font-weight: 500; fill: #F8FAFC; }

    .term-title { font-size: 12px; font-weight: 600; fill: #64748B; }
    .term-prompt { font-size: 13px; font-weight: 700; fill: #38B6FF; }
    .term-cmd { font-size: 13px; font-weight: 600; fill: #F8FAFC; }
    .term-log { font-size: 12px; font-weight: 400; fill: #94A3B8; }
    .term-highlight { font-size: 12px; font-weight: 700; fill: #38B6FF; }
    .term-success { font-size: 12px; font-weight: 700; fill: #10B981; }

    .code-kw { font-size: 12px; font-weight: 700; fill: #C084FC; }
    .code-type { font-size: 12px; font-weight: 600; fill: #38B6FF; }
    .code-str { font-size: 12px; font-weight: 400; fill: #34D399; }
    .code-plain { font-size: 12px; font-weight: 400; fill: #E2E8F0; }

    .pill-tech { font-size: 12px; font-weight: 600; fill: #E2E8F0; }
  </style>

  <!-- Base Canvas Box -->
  <rect width="1200" height="460" rx="18" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2"/>
  <rect width="1200" height="460" rx="18" fill="url(#grid-dots)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#brand-grad)"/>

  <!-- Ambient Radial Glows -->
  <circle cx="200" cy="200" r="260" fill="url(#glow-left)"/>
  <circle cx="950" cy="240" r="280" fill="url(#glow-right)"/>

  <!-- LEFT COLUMN: Branding & Installation -->
  <g transform="translate(50, 42)">
    <!-- Header Badge: Logo Emblem and Pill Badge match height (26px) & top (y=0) -->
    <g transform="translate(0, 0)">
      <!-- Attached Logo Emblem (r=13, center cx=13, cy=13 => Top Y=0, Bottom Y=26) -->
      <g transform="translate(0, 0)">
        <circle cx="13" cy="13" r="13" fill="url(#ring-grad)"/>
        <circle cx="13" cy="13" r="10.8" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
        <circle cx="13" cy="13" r="9.5" fill="url(#core-blue-grad)"/>
        <path d="M 13 6 Q 13 13 6 13 Q 13 13 13 20 Q 13 13 20 13 Q 13 13 13 6 Z" fill="#FFFFFF"/>
      </g>

      <!-- Pill Badge (y=0, height=26 => Top Y=0, Bottom Y=26, Center Y=13) -->
      <g transform="translate(32, 0)">
        <rect width="275" height="26" rx="13" fill="#0066FF" fill-opacity="0.15" stroke="#38B6FF" stroke-opacity="0.4" stroke-width="1"/>
        <text x="137.5" y="13" text-anchor="middle" dominant-baseline="central" class="font-sans badge-label">INAPPSTORY SDK • AGENT SKILLS</text>
      </g>
    </g>

    <!-- Title & Subtitle -->
    <text x="0" y="82" class="font-sans hero-title">ias-agent-skills</text>
    <text x="0" y="112" class="font-sans hero-sub">Supercharge AI agents with installable skills for</text>
    <text x="0" y="134" class="font-sans hero-sub">InAppStory SDK integration across 6 platforms.</text>

    <!-- Quick Install Command Card -->
    <g transform="translate(0, 160)">
      <rect width="470" height="52" rx="10" fill="#0B132B" stroke="#2563EB" stroke-opacity="0.4" stroke-width="1.2"/>
      <text x="16" y="26" dominant-baseline="central" class="font-mono cmd-prompt">$</text>
      <text x="32" y="26" dominant-baseline="central" class="font-mono cmd-text">npx skills add inappstory --skill '*'</text>
      <g transform="translate(415, 14)">
        <rect width="40" height="24" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1"/>
        <path d="M15 8H23M23 8V16M23 8L17 14" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- 6 Platform Badges Grid (Symmetrical 3x2 Grid with Icon Containers) -->
    <g transform="translate(0, 232)">
      <text x="0" y="12" class="font-sans" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">SUPPORTED PLATFORMS</text>
      <g transform="translate(0, 24)">
        <!-- Android -->
        <g transform="translate(0, 0)">
          <rect width="146" height="36" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#1E3A8A" stroke-width="1"/>
          <rect x="6" y="6" width="24" height="24" rx="6" fill="#1E293B" fill-opacity="0.6"/>
          <g transform="translate(18, 18) scale(0.40)">
            <path d="M-10 2 C-10 -4.5 -4.5 -10 2 -10 C8.5 -10 14 -4.5 14 2 Z" fill="#3DDC84"/>
            <circle cx="-3" cy="-4" r="1.5" fill="#0B132B"/>
            <circle cx="7" cy="-4" r="1.5" fill="#0B132B"/>
            <line x1="-5" y1="-10" x2="-8" y2="-15" stroke="#3DDC84" stroke-width="2" stroke-linecap="round"/>
            <line x1="9" y1="-10" x2="12" y2="-15" stroke="#3DDC84" stroke-width="2" stroke-linecap="round"/>
          </g>
          <text x="38" y="18" dominant-baseline="central" class="font-sans pill-tech">Android</text>
        </g>

        <!-- iOS -->
        <g transform="translate(156, 0)">
          <rect width="146" height="36" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#1E3A8A" stroke-width="1"/>
          <rect x="6" y="6" width="24" height="24" rx="6" fill="#1E293B" fill-opacity="0.6"/>
          <g transform="translate(18, 17.5) scale(0.58)">
            <path d="M2.5 -8.5 c0.8 -1 1.4 -2.4 1.2 -3.8 -1.2 0.1 -2.7 0.8 -3.5 1.8 -0.8 0.9 -1.4 2.3 -1.2 3.7 1.4 0.1 2.8 -0.7 3.5 -1.7 z M3.7 -6.6 c-1.9 -0.1 -3.5 1.1 -4.4 1.1 -0.9 0 -2.2 -1 -3.7 -1 -1.9 0 -3.7 1.1 -4.7 2.8 -2 3.5 -0.5 8.7 1.4 11.5 1 1.4 2.1 2.9 3.6 2.8 1.5 -0.1 2.1 -1 3.8 -1 s2.3 0.9 3.8 0.9 c1.5 0 2.5 -1.4 3.5 -2.8 1.1 -1.6 1.6 -3.2 1.6 -3.3 -0.1 -0.1 -3.1 -1.2 -3.1 -4.7 0 -3 2.4 -4.4 2.5 -4.5 -1.4 -2.1 -3.6 -2.3 -4.3 -2.3 z" fill="#38B6FF"/>
          </g>
          <text x="38" y="18" dominant-baseline="central" class="font-sans pill-tech">iOS</text>
        </g>

        <!-- Flutter -->
        <g transform="translate(312, 0)">
          <rect width="146" height="36" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#1E3A8A" stroke-width="1"/>
          <rect x="6" y="6" width="24" height="24" rx="6" fill="#1E293B" fill-opacity="0.6"/>
          <g transform="translate(18, 18) scale(0.42)">
            <path d="M5 -13 L-7.5 0 L-4 3.5 L12.5 -13 Z" fill="#54C5F8"/>
            <path d="M0 2.5 L-4.5 7 L0 11.5 L4.5 7 Z" fill="#01579B"/>
            <path d="M0 11.5 L4.5 16 L12 16 L4.5 7 Z" fill="#29B6F6"/>
          </g>
          <text x="38" y="18" dominant-baseline="central" class="font-sans pill-tech">Flutter</text>
        </g>

        <!-- React Native -->
        <g transform="translate(0, 44)">
          <rect width="146" height="36" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#1E3A8A" stroke-width="1"/>
          <rect x="6" y="6" width="24" height="24" rx="6" fill="#1E293B" fill-opacity="0.6"/>
          <g transform="translate(18, 18) scale(0.52)">
            <g stroke="#61DAFB" stroke-width="1.6" fill="none">
              <ellipse cx="0" cy="0" rx="12" ry="4.5"/>
              <ellipse cx="0" cy="0" rx="12" ry="4.5" transform="rotate(60)"/>
              <ellipse cx="0" cy="0" rx="12" ry="4.5" transform="rotate(120)"/>
            </g>
            <circle cx="0" cy="0" r="2.2" fill="#61DAFB"/>
          </g>
          <text x="38" y="18" dominant-baseline="central" class="font-sans pill-tech">React Native</text>
        </g>

        <!-- React -->
        <g transform="translate(156, 44)">
          <rect width="146" height="36" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#1E3A8A" stroke-width="1"/>
          <rect x="6" y="6" width="24" height="24" rx="6" fill="#1E293B" fill-opacity="0.6"/>
          <g transform="translate(18, 18) scale(0.52)">
            <g stroke="#00C2FF" stroke-width="1.6" fill="none">
              <ellipse cx="0" cy="0" rx="12" ry="4.5"/>
              <ellipse cx="0" cy="0" rx="12" ry="4.5" transform="rotate(60)"/>
              <ellipse cx="0" cy="0" rx="12" ry="4.5" transform="rotate(120)"/>
            </g>
            <circle cx="0" cy="0" r="2.2" fill="#00C2FF"/>
          </g>
          <text x="38" y="18" dominant-baseline="central" class="font-sans pill-tech">React</text>
        </g>

        <!-- Vanilla JS -->
        <g transform="translate(312, 44)">
          <rect width="146" height="36" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#1E3A8A" stroke-width="1"/>
          <rect x="6" y="6" width="24" height="24" rx="6" fill="#1E293B" fill-opacity="0.6"/>
          <g transform="translate(18, 18)">
            <rect x="-8" y="-8" width="16" height="16" rx="2.5" fill="#F7DF1E"/>
            <text x="5" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="9" fill="#000000" text-anchor="end">JS</text>
          </g>
          <text x="38" y="18" dominant-baseline="central" class="font-sans pill-tech">Vanilla JS</text>
        </g>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Modern macOS Terminal Window -->
  <g transform="translate(565, 42)">
    <!-- Terminal Outer Frame -->
    <rect width="585" height="375" rx="12" fill="url(#term-bg)" stroke="#1D4ED8" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Window Title Bar -->
    <path d="M0 12C0 5.37258 5.37258 0 12 0H573C579.627 0 585 5.37258 585 12V36H0V12Z" fill="#0B132B"/>
    <line x1="0" y1="36" x2="585" y2="36" stroke="#1E3A8A" stroke-width="1"/>

    <!-- Window Control Buttons (Mac Style) -->
    <circle cx="20" cy="18" r="6" fill="#FF5F56"/>
    <circle cx="38" cy="18" r="6" fill="#FFBD2E"/>
    <circle cx="56" cy="18" r="6" fill="#27C93F"/>

    <!-- Window Title -->
    <text x="292" y="18" dominant-baseline="central" class="font-mono term-title" text-anchor="middle">agent — inappstory-ios skill</text>

    <!-- Terminal Content Area -->
    <g transform="translate(20, 56)">
      <!-- Line 1: User Prompt -->
      <g id="term-step-1">
        <text x="0" y="16" class="font-mono term-prompt">❯</text>
        <text x="16" y="16" class="font-mono term-cmd">agent ask "Set up onboarding Stories in iOS"</text>
      </g>

      <!-- Line 2: Router Execution -->
      <g id="term-step-2">
        <text x="0" y="44" class="font-mono term-log">🌐 [router]</text>
        <text x="96" y="44" class="font-mono term-log">Fetching live docs from</text>
        <text x="246" y="44" class="font-mono term-highlight">docs.inappstory.com</text>
      </g>

      <!-- Line 3: Judgment Layer -->
      <g id="term-step-3">
        <text x="0" y="68" class="font-mono term-log">🧠 [judgment]</text>
        <text x="108" y="68" class="font-mono term-log">Applying iOS Swift / SwiftUI playbooks &amp; pitfalls</text>
      </g>

      <!-- Code Block Showcase Window -->
      <g id="term-code-block" transform="translate(0, 92)">
        <rect width="545" height="152" rx="8" fill="url(#code-bg)" stroke="#2563EB" stroke-opacity="0.4" stroke-width="1"/>

        <!-- Code Language Tag -->
        <rect x="455" y="10" width="75" height="20" rx="4" fill="#0B132B" stroke="#3B82F6" stroke-opacity="0.5" stroke-width="1"/>
        <text x="492.5" y="20" dominant-baseline="central" class="font-mono" font-size="10" font-weight="700" fill="#38B6FF" text-anchor="middle">SWIFT</text>

        <!-- Syntax Highlighted Swift Code -->
        <g transform="translate(16, 28)">
          <!-- Line 1 -->
          <text x="0" y="14" class="font-mono code-kw">import</text>
          <text x="52" y="14" class="font-mono code-type">InAppStory</text>

          <!-- Line 2 -->
          <text x="0" y="38" class="font-mono code-kw">let</text>
          <text x="28" y="38" class="font-mono code-plain">config = </text>
          <text x="92" y="38" class="font-mono code-type">IASConfig</text>
          <text x="156" y="38" class="font-mono code-plain">(storyID: </text>
          <text x="226" y="38" class="font-mono code-str">"onboarding_feed"</text>
          <text x="358" y="38" class="font-mono code-plain">)</text>

          <!-- Line 3 -->
          <text x="0" y="62" class="font-mono code-type">InAppStory</text>
          <text x="76" y="62" class="font-mono code-plain">.shared.</text>
          <text x="132" y="62" class="font-mono code-type">configure</text>
          <text x="198" y="62" class="font-mono code-plain">(with: config)</text>

          <!-- Line 4 -->
          <text x="0" y="86" class="font-mono code-plain">storyList.</text>
          <text x="76" y="86" class="font-mono code-type">showOnboarding</text>
          <text x="180" y="86" class="font-mono code-plain">(delegate: </text>
          <text x="252" y="86" class="font-mono code-kw">self</text>
          <text x="284" y="86" class="font-mono code-plain">)</text>
        </g>
      </g>

      <!-- Line 4: Result Status -->
      <g id="term-status" transform="translate(0, 262)">
        <circle cx="8" cy="8" r="5" fill="#10B981"/>
        <text x="22" y="8" dominant-baseline="central" class="font-mono term-success">✓ InAppStory SDK integration complete (0 drift detected)</text>
      </g>
    </g>
  </g>
</svg>
