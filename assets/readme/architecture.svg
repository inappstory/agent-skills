<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="100%" height="auto" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">How Each Skill Works - Router and Judgment Layer Architecture</title>
  <desc id="arch-desc">4-step architecture diagram: User Prompt -> Live Router -> Judgment Layer -> Production Code.</desc>

  <defs>
    <!-- Background Midnight Gradient -->
    <linearGradient id="bg-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#040710"/>
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brand-arch-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="45%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Connector Gradients -->
    <linearGradient id="arrow-grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="arrow-grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="arrow-grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Outer Ring Gradient from logo -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#D8B4FE"/>
    </linearGradient>

    <!-- Core Blue Disk Gradient -->
    <linearGradient id="core-blue-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A6DFF"/>
      <stop offset="100%" stop-color="#0052E0"/>
    </linearGradient>

    <!-- Step Card Background -->
    <linearGradient id="step-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="arch-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3B82F6" opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Monaco, Consolas, monospace; }

    .arch-label { font-size: 13px; font-weight: 800; fill: #38B6FF; letter-spacing: 1.5px; }
    .arch-card-title { font-size: 15px; font-weight: 700; fill: #F8FAFC; }
    .arch-card-sub { font-size: 12px; font-weight: 400; fill: #94A3B8; }
    .code-text { font-size: 11px; }
    .pill-tag { font-size: 10px; font-weight: 600; }
  </style>

  <!-- Container Box -->
  <rect width="1200" height="270" rx="16" fill="url(#bg-arch)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="1200" height="270" rx="16" fill="url(#arch-dots)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="3.5" rx="1.75" fill="url(#brand-arch-grad)"/>

  <!-- Main Workflow Group -->
  <g transform="translate(45, 28)">
    <!-- Header with Attached Logo Emblem Replica -->
    <g transform="translate(0, 0)">
      <g transform="translate(0, 0)">
        <circle cx="13" cy="13" r="13" fill="url(#ring-grad)"/>
        <circle cx="13" cy="13" r="10.8" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
        <circle cx="13" cy="13" r="9.5" fill="url(#core-blue-grad)"/>
        <path d="M 13 6 Q 13 13 6 13 Q 13 13 13 20 Q 13 13 20 13 Q 13 13 13 6 Z" fill="#FFFFFF"/>
      </g>
      <text x="34" y="13" dominant-baseline="central" class="font-sans arch-label">HOW EACH SKILL WORKS — DUAL-LAYER ARCHITECTURE</text>
    </g>

    <!-- Step 1: User Prompt -->
    <g transform="translate(0, 38)">
      <rect width="235" height="150" rx="12" fill="url(#step-card-bg)" stroke="#00C2FF" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="32" cy="32" r="15" fill="#00C2FF" fill-opacity="0.18"/>
      <text x="32" y="32" dominant-baseline="central" text-anchor="middle" class="font-sans" fill="#00C2FF" font-weight="800" font-size="13">1</text>
      <text x="56" y="32" dominant-baseline="central" class="font-sans arch-card-title">User Prompt</text>

      <rect x="14" y="62" width="207" height="72" rx="8" fill="#060A14" stroke="#1E293B" stroke-width="1"/>
      <text x="24" y="84" dominant-baseline="central" class="font-mono code-text" fill="#94A3B8">"How do I setup</text>
      <text x="24" y="101" dominant-baseline="central" class="font-mono code-text" fill="#38B6FF"> onboardings on iOS?"</text>
      <text x="24" y="119" dominant-baseline="central" class="font-sans code-text" fill="#64748B">⚡ Agent auto-activates skill</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <g transform="translate(235, 113)">
      <path d="M5 0 H35" stroke="url(#arrow-grad1)" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="33,-5 43,0 33,5" fill="#0066FF"/>
    </g>

    <!-- Step 2: Live Router -->
    <g transform="translate(283, 38)">
      <rect width="245" height="150" rx="12" fill="url(#step-card-bg)" stroke="#0066FF" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="32" cy="32" r="15" fill="#0066FF" fill-opacity="0.2"/>
      <text x="32" y="32" dominant-baseline="central" text-anchor="middle" class="font-sans" fill="#38B6FF" font-weight="800" font-size="13">2</text>
      <text x="56" y="32" dominant-baseline="central" class="font-sans arch-card-title">Live Router (`SKILL.md`)</text>

      <g transform="translate(16, 62)">
        <!-- Pill Tag 1 -->
        <rect x="0" y="0" width="213" height="22" rx="4" fill="#0066FF" fill-opacity="0.15" stroke="#38B6FF" stroke-opacity="0.3" stroke-width="1"/>
        <text x="10" y="11" dominant-baseline="central" class="font-mono pill-tag" fill="#38B6FF">🌐 Topic → docs.inappstory.com</text>

        <!-- Bullet 2 -->
        <text x="4" y="40" dominant-baseline="central" class="font-sans arch-card-sub">• Live HTTP fetch on demand</text>
        <!-- Bullet 3 -->
        <text x="4" y="58" dominant-baseline="central" class="font-sans arch-card-sub" fill="#38B6FF" font-weight="700">✓ Zero stale documentation</text>
      </g>
    </g>

    <!-- Connector 2 -> 3 -->
    <g transform="translate(528, 113)">
      <path d="M5 0 H35" stroke="url(#arrow-grad2)" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="33,-5 43,0 33,5" fill="#C084FC"/>
    </g>

    <!-- Step 3: Judgment Layer -->
    <g transform="translate(576, 38)">
      <rect width="250" height="150" rx="12" fill="url(#step-card-bg)" stroke="#C084FC" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="32" cy="32" r="15" fill="#C084FC" fill-opacity="0.2"/>
      <text x="32" y="32" dominant-baseline="central" text-anchor="middle" class="font-sans" fill="#C084FC" font-weight="800" font-size="13">3</text>
      <text x="56" y="32" dominant-baseline="central" class="font-sans arch-card-title">Judgment Layer</text>

      <g transform="translate(16, 62)">
        <rect x="0" y="0" width="95" height="20" rx="4" fill="#C084FC" fill-opacity="0.15" stroke="#C084FC" stroke-opacity="0.3" stroke-width="1"/>
        <text x="8" y="10" dominant-baseline="central" class="font-mono pill-tag" fill="#D8B4FE">playbooks.md</text>

        <rect x="103" y="0" width="78" height="20" rx="4" fill="#C084FC" fill-opacity="0.15" stroke="#C084FC" stroke-opacity="0.3" stroke-width="1"/>
        <text x="111" y="10" dominant-baseline="central" class="font-mono pill-tag" fill="#D8B4FE">pitfalls.md</text>

        <rect x="0" y="26" width="92" height="20" rx="4" fill="#C084FC" fill-opacity="0.15" stroke="#C084FC" stroke-opacity="0.3" stroke-width="1"/>
        <text x="8" y="36" dominant-baseline="central" class="font-mono pill-tag" fill="#D8B4FE">decisions.md</text>

        <text x="4" y="62" dominant-baseline="central" class="font-sans arch-card-sub" fill="#C084FC" font-weight="700">⚡ Prevents SDK version traps</text>
      </g>
    </g>

    <!-- Connector 3 -> 4 -->
    <g transform="translate(826, 113)">
      <path d="M5 0 H35" stroke="url(#arrow-grad3)" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="33,-5 43,0 33,5" fill="#10B981"/>
    </g>

    <!-- Step 4: Production Code -->
    <g transform="translate(874, 38)">
      <rect width="236" height="150" rx="12" fill="url(#step-card-bg)" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="32" cy="32" r="15" fill="#10B981" fill-opacity="0.2"/>
      <text x="32" y="32" dominant-baseline="central" text-anchor="middle" class="font-sans" fill="#10B981" font-weight="800" font-size="13">4</text>
      <text x="56" y="32" dominant-baseline="central" class="font-sans arch-card-title">Production Code</text>

      <rect x="14" y="62" width="208" height="72" rx="8" fill="#060A14" stroke="#1E293B" stroke-width="1"/>
      <text x="24" y="84" dominant-baseline="central" class="font-sans code-text" fill="#10B981">✓ Version-matched SDK</text>
      <text x="24" y="101" dominant-baseline="central" class="font-sans code-text" fill="#E2E8F0">✓ Flawless integration</text>
      <text x="24" y="119" dominant-baseline="central" class="font-sans code-text" fill="#38B6FF">✓ Zero drift output</text>
    </g>
  </g>
</svg>
